; PlatformIO project for power_relay.ino (Story 26.7).
; Open this directory in VS Code with the PlatformIO IDE extension to
; build/upload without needing the Arduino IDE.
;
; This env targets the ESP8266-based NodeMCU V2/V3 (generic ESP-12E clone
; board). For an ESP32 board instead, add a second [env:...] section, e.g.:
;
;   [env:esp32dev]
;   platform = espressif32
;   board = esp32dev
;   framework = arduino
;   monitor_speed = 115200
;
; and select the matching environment in PlatformIO's status bar before
; building/uploading.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
